      body {
        margin: 0;
        background: #f5f5f5;
        min-height: 100vh;
        width: fit-content;
      }
      .badge-container {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0;
      }

      .badge {
        break-inside: avoid;
        page-break-inside: avoid;
        width: 148.5mm;
        height: 100%;
        background: linear-gradient(
          174deg,
          #2488a6 -69.71%,
          #c5e0e8 16.96%,
          #fff 95.34%
        );
      }
      .download-btn {
        background: #2488a6;
        color: white;
        border: none;
        padding: 12px 24px;
        border-radius: 8px;
        cursor: pointer;
        font-family: "Unbounded";
        font-size: 16px;
        transition: background 0.3s;
        margin-top: 20px;
        min-width: 200px;
        text-align: center;
        width: 200px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0px;
      }

      .download-btn:hover {
        background: #1b6d8a;
      }

    <div class="download-btn" onclick="downloadPDF()">Скачать PDF</div>

  <script>
    function downloadPDF() {
      const element = document.getElementById("badgeContainer");
      const opt = {
        margin: 0,
        filename: "badge.pdf",
        image: { type: "jpeg", quality: 1 },
        html2canvas: {
          scale: 2,
          useCORS: true,
          logging: true,
          letterRendering: true,
          scrollY: 0,
          scrollX: 0,
        },
        jsPDF: {
          unit: "mm",
          format: "a5",
          orientation: "landscape",
          compress: true,
        },
      };

      html2pdf().set(opt).from(element).save();
    }
  </script>
